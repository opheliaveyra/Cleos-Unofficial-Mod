# Android CI for the Cleos mod default branch.
name: Android CI

on:
  push:
    branches: [feature/chat-file-upload-and-hold-to-talk]
  pull_request:
    branches: [feature/chat-file-upload-and-hold-to-talk]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      # Android API 37 is published as android-37.0, not android-37.
      # Older AGP versions may still resolve the legacy android-37 path.
      - name: Install compile SDK
        run: |
          sdkmanager --channel=3 'platforms;android-37.0'
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug build
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug

      # Report only until existing lint findings are triaged.
      - name: Lint (report only)
        continue-on-error: true
        run: ./gradlew :app:lintDebug

      - name: Upload lint and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/
          if-no-files-found: ignore
